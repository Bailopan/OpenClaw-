[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-radar"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "beautifulsoup4>=4.12",
  "yandex-ai-studio-sdk>=0.16",
  "google-auth[requests]>=2.35"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
